<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Noisli</title>
    <link rel="icon" type="image/x-icon" href="../assets/logo.jpg" />
    <link rel="stylesheet" href="./login.css" type="text/css" />
  </head>
  <body>
    <div class="left-column">
      <h2 id="name">Noisli</h2>
      <h4 id="welcome-text">Welcome back!<br />Log In to your account.</h4>
      <a href="#" class="google-login-button">
        <img
          src="../assets/google-logo.png"
          alt="Google Logo"
          class="google-logo"
        />
        <span class="button-text">Log In with Google</span>
      </a>

      <span id="alt-login-text">Or Log In with your Email</span>

      <div class="login-form">
        <input type="email" id="email" placeholder="Email" />
        <input type="password" id="password" placeholder="Password" />
        <input type="submit" id="login-submit" value="Log In" />
      </div>

      <div class="bottom-links">
        <a href="#" class="forgot-password">Forgot Password?</a>
        <br /><br /><br />
        <span class="bottom-text">Don't have an account?</span>
        <a href="../signup/signup.html" class="sign-up">Sign Up for Free</a>
      </div>
    </div>

    <div class="right-column">
      <div class="hello-text">
        <h2>Oh, Hello.<br />Welcome back!</h2>
      </div>
    </div>
  </body>
</html>
