<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | Noisli</title>
    <link rel="icon" type="image/x-icon" href="../assets/logo.jpg" />
    <link rel="stylesheet" href="./signup.css" type="text/css" />
  </head>
  <body>
    <div class="left-column">
      <h2 id="name">Noisli</h2>
      <h4 id="welcome-text">
        Nice to meet you!<br />Sign Up for a Free account.
      </h4>
      <a href="#" class="google-login-button">
        <img
          src="../assets/google-logo.png"
          alt="Google Logo"
          class="google-logo"
        />
        <span class="button-text">Sign Up Free with Google</span>
      </a>

      <span id="alt-login-text">Or Sign Up with your Email</span>

      <div class="sign-up-form">
        <input type="email" id="email" placeholder="Email" />
        <input type="password" id="password" placeholder="Password" />
        <input type="submit" id="sign-up-submit" value="Sign Up for Free" />
      </div>

      <div class="bottom-links">
        <label class="checkbox-container">
          <input type="checkbox" id="agree-checkbox" />
          <span class="checkmark"></span>
          I agree to Noisli's
          <a href="">Terms & Privacy</a>
        </label>

        <p class="bottom-text">
          Already registered?
          <a href="../login/login.html" class="sign-up">Log In</a>
        </p>
      </div>
    </div>

    <div class="right-column">
      <div class="hello-text">
        <h2>Welcome to Noisli,<br />your digital place<br />for focus.</h2>
      </div>
    </div>
  </body>
</html>
