<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>
    <link rel="stylesheet" href="style.css" type="text/css" />
  </head>

  <body>
    <form-container>
      <form>
        <a href="sign-up.html"
          ><button type="button" id="sign-up">Sign Up</button></a
        >
        <button type="button" id="sign-in">Sign In</button>

        <br /><br />

        <label id="email-container">
          <input type="email" placeholder="Email" />
        </label>

        <br /><br />

        <label id="password-container">
          <input type="password" placeholder="Password" />
        </label>

        <br /><br />

        <label id="enter-button">
          <button type="submit" id="enter">Sign In</button>
        </label>
      </form>
    </form-container>
  </body>
</html>
